[workspace]
members = ["crates/ferrigura", "crates/ferrigura-cli", "crates/ferrigura-cose", "crates/ferrigura-elk", "crates/ferrigura-jsmath", "crates/ferrigura-model", "crates/ferrigura-node", "crates/ferrigura-render", "crates/ferrigura-syntax", "crates/ferrigura-text"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/sebastian-software/ferrigura"
publish = false

[workspace.dependencies]
ferrigura-model = { path = "crates/ferrigura-model" }
indexmap = { version = "2", features = ["serde"] }
logos = "0.15"
serde = { version = "1", features = ["derive"] }
# `float_roundtrip`: JSON numbers are read exactly, as JavaScript reads them. See docs-port/canonical-model.md, Numbers.
serde_json = { version = "1", features = ["float_roundtrip"] }
