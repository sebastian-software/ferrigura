[workspace]
members = ["crates/ferrigura", "crates/ferrigura-cli", "crates/ferrigura-cose", "crates/ferrigura-elk", "crates/ferrigura-jsmath", "crates/ferrigura-model", "crates/ferrigura-node", "crates/ferrigura-path", "crates/ferrigura-render", "crates/ferrigura-swimlane", "crates/ferrigura-syntax", "crates/ferrigura-text", "crates/ferrigura-venn"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/sebastian-software/ferrigura"
publish = false

[workspace.dependencies]
ferrigura-model = { path = "crates/ferrigura-model", version = "0.0.0" }
indexmap = { version = "2", features = ["serde"] }
logos = "0.15"
serde = { version = "1", features = ["derive"] }
# `float_roundtrip`: JSON numbers are read exactly, as JavaScript reads them. See docs-port/canonical-model.md, Numbers.
serde_json = { version = "1", features = ["float_roundtrip"] }

# The correctly rounded functions of ferrigura-jsmath run in the inner loops of the layouts; a debug
# build of them makes the differential tests too slow.
[profile.dev.package.ferrigura-jsmath]
opt-level = 3
