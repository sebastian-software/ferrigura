# The repository's root is the package `ferrigura`, the library, so that one release covers the
# product: release-please's Rust strategy reads the version of this package and moves every member
# of the workspace with it (docs/decisions/0004-one-version-one-release.md). Its sources stay in crates/ferrigura.
[package]
name = "ferrigura"
description = "Render Mermaid diagram text to SVG, without a browser"
version = "0.6.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/ferrigura"
readme = "crates/ferrigura/README.md"
keywords = ["ferrigura", "mermaid", "diagram", "svg", "flowchart"]
categories = ["visualization", "rendering"]
include = ["/crates/ferrigura/src/**", "/crates/ferrigura/README.md", "/Cargo.toml", "/LICENSE"]
autoexamples = false
autotests = false
autobenches = false

[lib]
path = "crates/ferrigura/src/lib.rs"

[[example]]
name = "flowchart-elk"
path = "crates/ferrigura/examples/flowchart-elk.rs"

[[example]]
name = "render"
path = "crates/ferrigura/examples/render.rs"

[[test]]
name = "class"
path = "crates/ferrigura/tests/class.rs"

[[test]]
name = "flowchart"
path = "crates/ferrigura/tests/flowchart.rs"

[[test]]
name = "info"
path = "crates/ferrigura/tests/info.rs"

[[test]]
name = "journey"
path = "crates/ferrigura/tests/journey.rs"

[[test]]
name = "output"
path = "crates/ferrigura/tests/output.rs"

[[test]]
name = "pie"
path = "crates/ferrigura/tests/pie.rs"

[[test]]
name = "plugins"
path = "crates/ferrigura/tests/plugins.rs"

[[test]]
name = "renderer"
path = "crates/ferrigura/tests/renderer.rs"

[[test]]
name = "state"
path = "crates/ferrigura/tests/state.rs"

[[test]]
name = "snapshots"
path = "crates/ferrigura/tests/snapshots.rs"

[[test]]
name = "well_formed"
path = "crates/ferrigura/tests/well_formed.rs"

[dependencies]
ferrigura-model = { path = "crates/ferrigura-model", version = "0.6.0" }
ferrigura-render = { path = "crates/ferrigura-render", version = "0.6.0" }
ferrigura-syntax = { path = "crates/ferrigura-syntax", version = "0.6.0" }
serde_json.workspace = true

[dev-dependencies]
roxmltree = "0.21"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[workspace]
members = ["crates/ferrigura-cli", "crates/ferrigura-cose", "crates/ferrigura-elk", "crates/ferrigura-jsmath", "crates/ferrigura-model", "crates/ferrigura-node", "crates/ferrigura-path", "crates/ferrigura-render", "crates/ferrigura-swimlane", "crates/ferrigura-syntax", "crates/ferrigura-text", "crates/ferrigura-venn"]
# Plain cargo commands at the root cover the whole workspace, not only the root package.
default-members = [".", "crates/ferrigura-cli", "crates/ferrigura-cose", "crates/ferrigura-elk", "crates/ferrigura-jsmath", "crates/ferrigura-model", "crates/ferrigura-node", "crates/ferrigura-path", "crates/ferrigura-render", "crates/ferrigura-swimlane", "crates/ferrigura-syntax", "crates/ferrigura-text", "crates/ferrigura-venn"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/sebastian-software/ferrigura"
homepage = "https://sebastian-software.github.io/ferrigura/"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.dependencies]
# One regex engine for the whole workspace: the marked port needs Oniguruma's look-around and
# back-references, and the other patterns are small, so the `regex` crate is not linked as well.
ferroni = { version = "2.7.0", default-features = false }
indexmap = { version = "2", features = ["serde"] }
logos = "0.16"
serde = { version = "1", features = ["derive"] }
# `float_roundtrip`: JSON numbers are read exactly, as JavaScript reads them. See docs/canonical-model.md, Numbers.
serde_json = { version = "1", features = ["float_roundtrip"] }

# The correctly rounded functions of ferrigura-jsmath run in the inner loops of the layouts; a debug
# build of them makes the differential tests too slow.
[profile.dev.package.ferrigura-jsmath]
opt-level = 3

# Release builds trade build time for size. Fat LTO in one codegen unit and stripped symbols take a
# quarter off the published artifacts and nothing off the render time. `opt-level = "s"` is for the crates whose
# code runs once per diagram: the parsers, the model, the renderers, the regex engine, the facade.
# The layout engines, the browser arithmetic and the text stack below run in the inner loops and stay
# at 3: with every crate at "s" the corpus renders 78 percent slower, with this split as fast as at 3
# throughout (docs/LEARNINGS.md, "The build"). A crate moves between the two groups only with a benchmark of the
# corpus. The profile does not move the output; `cargo test --release --test snapshots` renders the
# corpus under it.
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "s"
strip = "symbols"
# A panic in the CLI aborts, so the binary carries no unwinding tables. The addon unwinds, see below.
panic = "abort"

[profile.release.package.ferrigura-cose]
opt-level = 3

[profile.release.package.ferrigura-elk]
opt-level = 3

[profile.release.package.ferrigura-jsmath]
opt-level = 3

[profile.release.package.ferrigura-path]
opt-level = 3

[profile.release.package.ferrigura-swimlane]
opt-level = 3

[profile.release.package.ferrigura-text]
opt-level = 3

[profile.release.package.ferrigura-venn]
opt-level = 3

[profile.release.package.font-types]
opt-level = 3

[profile.release.package.harfrust]
opt-level = 3

[profile.release.package.read-fonts]
opt-level = 3

[profile.release.package.skera]
opt-level = 3

[profile.release.package.write-fonts]
opt-level = 3

# The Node addon turns a panic into a JavaScript exception, so it must unwind.
[profile.release-node]
inherits = "release"
panic = "unwind"
