[workspace]
members = ["crates/ferrigura-model"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/sebastian-software/ferraid"
publish = false

[workspace.dependencies]
ferrigura-model = { path = "crates/ferrigura-model" }
logos = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
