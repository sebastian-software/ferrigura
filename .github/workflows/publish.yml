# Publishes ferrigura's crates (docs-port/RELEASE.md), after the publish skeleton of
# sebastian-software/standards (reference/release-please/publish-skeleton.yml, standards-v0.9.0).
#
# One product, one release signal: release-please keeps one release pull request for the
# workspace; merging it creates the tag and the GitHub release, and publish-crates publishes from
# that tag. The manual path is for retries only: dispatch the workflow with the release's tag, and
# every job checks out that tag, never main.
#
# Until the first release the repository variable RELEASES_ENABLED is not 'true', so the workflow
# opens no release pull request and publishes nothing. `publish = false` in the workspace is the
# second latch, which cargo itself enforces.

name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to (re)publish, for example ferrigura-v0.1.0'
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-please:
    name: release please
    if: ${{ github.event_name == 'push' && vars.RELEASES_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # A GitHub App's token, so that CI runs on the release pull request: events created with the
      # built-in GITHUB_TOKEN start no workflow. The App's client id is the variable
      # RELEASE_APP_CLIENT_ID, its private key the secret RELEASE_APP_PRIVATE_KEY.
      - id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.token.outputs.token }}

  publish-crates:
    name: publish to crates.io
    needs: release-please
    # `!cancelled()` lets the job run when release-please was skipped by the manual path; a plain
    # `needs` would skip it too.
    if: >-
      ${{ !cancelled() && vars.RELEASES_ENABLED == 'true' && (
        (github.event_name == 'push' && needs.release-please.outputs.releases_created == 'true') ||
        github.event_name == 'workflow_dispatch'
      ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # crates.io Trusted Publishing exchanges this OIDC token for a short-lived registry token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch

      - uses: sebastian-software/standards/.github/actions/publish-crates@3d0df5fa2a45389fa527e684cf337d62e1f54dbc # v0.9.0
        with:
          # Leaves first: a crate must be on crates.io before a crate that depends on it.
          crates: |
            ferrigura-jsmath
            ferrigura-model
            ferrigura-text
            ferrigura-elk
            ferrigura-path
            ferrigura-cose
            ferrigura-venn
            ferrigura-swimlane
            ferrigura-syntax
            ferrigura-render
            ferrigura
            ferrigura-cli
          # The first publish needs a token: Trusted Publishing can be enabled only for a crate that
          # exists. Drop this input once it is enabled for every crate.
          token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
