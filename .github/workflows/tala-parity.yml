name: TALA parity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out pinned D2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: d2lang/d2
          ref: b463ea5d47272f4da6e1e08012dbb15a6a4dbcde
          path: .tala-reference
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .tala-reference/go.mod
          cache-dependency-path: .tala-reference/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: tools/port/.node-version
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
      - name: Run the unmodified Go TALA suite
        working-directory: .tala-reference
        env:
          GOTOOLCHAIN: local
          GOWORK: 'off'
        run: go test -count=1 -mod=readonly ./d2layouts/d2talalayout/...
      - name: Build the live oracle and native tools
        id: binaries
        run: |
          tools/tala-pilot/reference/build.sh .tala-reference "$RUNNER_TEMP/tala-reference"
          cargo build --locked --features experimental-tala --example tala_pilot
          cargo build --locked --manifest-path tools/tala-pilot/rust/Cargo.toml
      - name: Compare the ordered adapter graph and prescale with Go
        run: |
          node tools/tala-pilot/trace-overlay.mjs .tala-reference "$RUNNER_TEMP/tala-layout-graph" layout-graph
          GOFLAGS="-overlay=$RUNNER_TEMP/tala-layout-graph/overlay.json" \
            tools/tala-pilot/reference/build.sh .tala-reference "$RUNNER_TEMP/tala-layout-graph-reference"
          node tools/tala-pilot/check-layout-graph.mjs \
            --reference "$RUNNER_TEMP/tala-reference" \
            --trace "$RUNNER_TEMP/tala-layout-graph-reference" \
            --rust tools/tala-pilot/rust/target/debug/ferrigura-tala
      - name: Compare seeded sizeless placement with Go
        if: ${{ !cancelled() && steps.binaries.outcome == 'success' }}
        run: |
          node tools/tala-pilot/trace-overlay.mjs .tala-reference "$RUNNER_TEMP/tala-sizeless" sizeless-placement
          GOFLAGS="-overlay=$RUNNER_TEMP/tala-sizeless/overlay.json" \
            tools/tala-pilot/reference/build.sh .tala-reference "$RUNNER_TEMP/tala-sizeless-reference"
          node tools/tala-pilot/check-sizeless-placement.mjs \
            "$RUNNER_TEMP/tala-reference" "$RUNNER_TEMP/tala-sizeless-reference" \
            tools/tala-pilot/rust/target/debug/ferrigura-tala
      - name: Compare authored edge routes and label centers with Go
        if: ${{ !cancelled() && steps.binaries.outcome == 'success' }}
        run: |
          node tools/tala-pilot/trace-overlay.mjs .tala-reference "$RUNNER_TEMP/tala-route-output" route-output
          GOFLAGS="-overlay=$RUNNER_TEMP/tala-route-output/overlay.json" \
            tools/tala-pilot/reference/build.sh .tala-reference "$RUNNER_TEMP/tala-route-output-reference"
          node tools/tala-pilot/check-route-output.mjs \
            --reference "$RUNNER_TEMP/tala-reference" \
            --trace "$RUNNER_TEMP/tala-route-output-reference" \
            --rust tools/tala-pilot/rust/target/debug/ferrigura-tala
      - name: Compare the flat orthogonal visibility graph with Go
        if: ${{ !cancelled() && steps.binaries.outcome == 'success' }}
        run: |
          node tools/tala-pilot/trace-overlay.mjs .tala-reference "$RUNNER_TEMP/tala-ovg" ovg-seed
          GOFLAGS="-overlay=$RUNNER_TEMP/tala-ovg/overlay.json" \
            tools/tala-pilot/reference/build.sh .tala-reference "$RUNNER_TEMP/tala-ovg-reference"
          node tools/tala-pilot/check-ovg-seed.mjs \
            "$RUNNER_TEMP/tala-reference" "$RUNNER_TEMP/tala-ovg-reference" \
            tools/tala-pilot/rust/target/debug/ferrigura-tala
      - name: Compare complete candidate scores and seed selection with Go
        if: ${{ !cancelled() && steps.binaries.outcome == 'success' }}
        run: |
          node tools/tala-pilot/trace-overlay.mjs .tala-reference "$RUNNER_TEMP/tala-score" candidate-score
          GOFLAGS="-overlay=$RUNNER_TEMP/tala-score/overlay.json" \
            tools/tala-pilot/reference/build.sh .tala-reference "$RUNNER_TEMP/tala-score-reference"
          node tools/tala-pilot/check-candidate-scores.mjs \
            --reference "$RUNNER_TEMP/tala-reference" \
            --traced "$RUNNER_TEMP/tala-score-reference" \
            --rust tools/tala-pilot/rust/target/debug/ferrigura-tala
      - name: Require a passing Rust counterpart for every upstream correctness test
        if: ${{ !cancelled() && steps.binaries.outcome == 'success' }}
        run: |
          node tools/tala-pilot/check-upstream-tests.mjs \
            --d2 .tala-reference --json --verify --require-complete > "$RUNNER_TEMP/tala-tests.json"
      - name: Require exact geometry and SVG parity on every flowchart
        if: ${{ !cancelled() && steps.binaries.outcome == 'success' }}
        run: |
          node tools/tala-pilot/check-end-to-end.mjs \
            --reference "$RUNNER_TEMP/tala-reference" \
            --ferrigura target/debug/examples/tala_pilot \
            --rust tools/tala-pilot/rust/target/debug/ferrigura-tala > "$RUNNER_TEMP/tala-flowcharts.json"
      - name: Upload the parity reports
        if: ${{ !cancelled() && steps.binaries.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tala-parity
          path: |
            ${{ runner.temp }}/tala-tests.json
            ${{ runner.temp }}/tala-flowcharts.json
