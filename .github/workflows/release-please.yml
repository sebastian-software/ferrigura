name: Release

# release-please keeps a release pull request for the crates (docs-port/RELEASE.md). Until the first
# release it runs only by hand, so it opens no pull request before the steps of the plan are done;
# then it runs on every push to main.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
