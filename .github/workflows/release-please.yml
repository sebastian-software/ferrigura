name: Release

# release-please keeps a release pull request for the crates (docs-port/RELEASE.md). Until the first
# release it runs only by hand, so it opens no pull request before the steps of the plan are done;
# then it runs on every push to main.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      # The release pull request is opened with a GitHub App's token, so that CI runs on it: a pull
      # request opened with the default GITHUB_TOKEN starts no workflow. The App's client id is the
      # repository variable RELEASE_APP_CLIENT_ID, its private key the secret RELEASE_APP_PRIVATE_KEY.
      - id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    # Publishes the crates when release-please has made a release, in the order of their
    # dependencies. It runs only when the repository variable PUBLISH_CRATES is 'true', which is set
    # with the first release, after the trademark check (docs-port/RELEASE.md).
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true' && vars.PUBLISH_CRATES == 'true'
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # The toolchain comes from rust-toolchain.toml; the runner's rustup installs it on first use.
      - run: cargo publish --workspace --exclude ferrigura-node
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
