name: CI

# A pull request runs once, for its merge commit; a push to its branch does not run again. A push to
# main runs every job, and the release reads that run (docs/decisions/0005-quality-gates.md).
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

# Each push to main runs to the end in a group of its own commit: the release reads the run of its
# exact commit, and a later merge must neither cancel it nor replace it while it waits for a macOS
# runner. A pull request keeps one group per ref, so a newer run cancels the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: tools/port/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: pnpm
          cache-dependency-path: tools/port/pnpm-lock.yaml
          node-version-file: tools/port/.node-version
      - run: pnpm -C tools/port install --frozen-lockfile
      - run: pnpm -C tools/port run lint

  # README.md against what mdtheme generates from README.md.src and the pinned theme.
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.11.10
          install_args: --locked
      - run: mise run readme:check

  # The tests of the harness (tools/port), with node --test.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: tools/port/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: pnpm
          cache-dependency-path: tools/port/pnpm-lock.yaml
          node-version-file: tools/port/.node-version
      - run: pnpm -C tools/port install --frozen-lockfile
      - run: pnpm -C tools/port test

  rust:
    runs-on: ubuntu-latest
    env:
      # Integration-test binaries must fit on hosted runners; keep file/line backtraces.
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The toolchain comes from rust-toolchain.toml; the runner's rustup installs it on first use.
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --workspace
      - run: cargo test --workspace --no-fail-fast
      # Exercise the acos interval test with x86 fused instructions as well as the baseline above.
      - run: RUSTFLAGS="-C target-feature=+fma" cargo test --release -p ferrigura-jsmath acos_fast_matches_fixed_point
      # The addon crate with one diagram type: its features stay compiling (decision 0020).
      - run: cargo test -p ferrigura-node --no-default-features --features sequence
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: tools/port/.node-version
      - name: Node addon
        run: node --test crates/ferrigura-node/test/render.test.mjs

  # The declared MSRV must build the library and CLI and compile the facade examples.
  minimum-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build with the declared minimum Rust
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(p["rust_version"] for p in data["packages"] if p["name"] == "ferrigura"))')
          rustup toolchain install "$version" --profile minimal
          cargo +"$version" build --locked -p ferrigura -p ferrigura-cli
          cargo +"$version" test --locked -p ferrigura --doc

  snapshots:
    # ferrigura's own output against crates/ferrigura/tests/snapshots/svg.tsv. The manifest holds the
    # aarch64 renders (ferrigura_jsmath rounds with fused multiply-adds there), so this runs on an arm64
    # runner: Linux, since the macOS runners queue for an hour and the hashes depend on the architecture
    # alone.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The arm64 image has no rustup; the toolchain itself comes from rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
      - run: cargo test --release --test snapshots
      - run: cargo test --release -p ferrigura-jsmath
      - name: Venn layout exactly against its Chromium captures (arm64, as they were taken)
        # The x86-64 test job compares the captures within a tolerance: without fused multiply-adds,
        # atan2 rounds as V8 does on x86-64 (crates/ferrigura-venn/tests/corpus.rs).
        run: cargo test --release -p ferrigura-venn --test corpus

  # port-diff and port-geometry check ferrigura against upstream Mermaid at the pin of
  # tools/reference, with its patches (docs/decisions/0014-upstream-reference-at-a-pin.md), built once per pin and cached.
  port-diff:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        diagram:
          [
            pie,
            info,
            flowchart,
            sequence,
            class,
            state,
            er,
            gantt,
            timeline,
            gitgraph,
            journey,
            mindmap,
            block,
            packet,
            xychart,
            sankey,
            quadrantChart,
            requirement,
            c4,
            kanban,
            architecture,
            treemap,
            ishikawa,
            eventmodeling,
            agentflow,
            cynefin,
            radar,
            railroad,
            treeView,
            usecase,
            venn,
            wardley,
            swimlanes,
            flowchart-data,
            class-data,
            state-data,
            er-data,
            requirement-data,
            kanban-data,
            config,
            yaml,
            theme,
            markdown,
          ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: tools/port/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: pnpm
          cache-dependency-path: tools/port/pnpm-lock.yaml
          node-version-file: tools/port/.node-version
      - run: pnpm -C tools/port install --frozen-lockfile
      - name: Restore the reference build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/reference
          key: reference-${{ runner.os }}-${{ hashFiles('tools/reference/**') }}
      - name: Build the reference (upstream Mermaid at the pin, with its patches)
        run: echo "REFERENCE_ROOT=$(tools/reference/setup.sh)" >> "$GITHUB_ENV"
      - name: Differential parse against the reference
        run: pnpm -C tools/port port:diff ${{ matrix.diagram }}
      - name: Pie header rules against the reference DB setters
        if: matrix.diagram == 'pie'
        run: pnpm -C tools/port port:check-header

  port-geometry:
    # The comparison needs a browser whose text layout keeps fractional glyph advances, as the Rust
    # measurement does. Chromium on macOS does; on Linux the classic themes still differ by about
    # 0.7 px with hinting off (docs/LEARNINGS.md, open questions). The macOS runners queue for an hour,
    # so this runs for every push to main and for a pull request with the label ci:macos.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:macos')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: tools/port/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: pnpm
          cache-dependency-path: tools/port/pnpm-lock.yaml
          node-version-file: tools/port/.node-version
      - run: pnpm -C tools/port install --frozen-lockfile
      - name: Restore the reference build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/reference
          key: reference-${{ runner.os }}-${{ hashFiles('tools/reference/**') }}
      - name: Build the reference (upstream Mermaid at the pin, with its patches)
        run: echo "REFERENCE_ROOT=$(tools/reference/setup.sh)" >> "$GITHUB_ENV"
      - run: pnpm -C tools/port exec playwright install chromium
      - name: Registered font metrics and embedded designs in Chromium
        run: pnpm -C tools/port exec tsx text/registered-fonts.ts
      - name: Internal placeholder coverage and browser fallback
        run: pnpm -C tools/port run test:placeholder-coverage
      - name: Supplied font families across custom renderers in Chromium
        run: pnpm -C tools/port run test:custom-font-renderers
      - name: Host font aliases across representative renderers in Chromium
        run: pnpm -C tools/port run test:font-alias-browser
      - name: Pie geometry against the reference in Chromium
        run: pnpm -C tools/port port:geometry-pie
      - name: Scoped styles of several pies in one page
        run: pnpm -C tools/port port:scope-pie
      - name: Flowchart geometry against the reference in Chromium
        run: pnpm -C tools/port port:geometry-flowchart
      - name: Adaptive flowchart geometry against the reference with centered ports
        run: pnpm -C tools/port port:geometry-flowchart --routing adaptive
      - name: Geometry of the other diagram types against the reference in Chromium
        # Every type runs, so one failing type does not hide the others.
        run: |
          status=0
          for type in sequence class state er gantt timeline gitgraph journey info requirement xychart kanban c4 block quadrantChart packet ishikawa sankey treemap eventmodeling mindmap architecture agentflow cynefin radar railroad treeView usecase venn wardley swimlanes; do
            pnpm -C tools/port port:geometry "$type" || status=1
          done
          exit $status

  native-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          package_json_file: node/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.3'
      - run: pnpm -C node install --frozen-lockfile --ignore-scripts
      - id: matrix
        working-directory: node
        # The macOS addon build needs a macOS runner, which queues for an hour: a pull request leaves it
        # out unless it carries the label ci:macos; the push to main builds every platform.
        run: echo "matrix=$(node scripts/native-matrix.mjs ${{ (github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ci:macos')) && '--without-macos' || '' }})" >> "$GITHUB_OUTPUT"

  native-npm:
    needs: native-matrix
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.native-matrix.outputs.matrix) }}
    defaults:
      run:
        shell: bash
        working-directory: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          package_json_file: node/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.3'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm native:check
      - name: Build native addon
        uses: ./node/node_modules/ferramenta-native/actions/build-native
        with:
          target: ${{ matrix.target }}
          libc: ${{ matrix.libc }}
          command: pnpm build
        env:
          FERRIGURA_RUST_TARGET: ${{ matrix.target }}
      - run: pnpm test && pnpm typecheck && pnpm lint && pnpm format:check && pnpm pack:check
        if: matrix.native
      - name: Capture native replay
        if: matrix.native
        run: |
          mkdir -p replay
          node scripts/render-replay.mjs A > replay/${{ matrix.id }}.json
      # Derive the exact floor from the published facade so dependency automation cannot bump it.
      - name: Read the minimum Node version
        id: minimum-node
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          node -e 'const range = require("./ferrigura/package.json").engines.node; const match = /^>=(\d+\.\d+\.\d+)$/.exec(range); if (!match) throw new Error(`Expected an exact Node floor, got ${range}`); console.log(`version=${match[1]}`)' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        with:
          node-version: ${{ steps.minimum-node.outputs.version }}
      - name: Test the packed consumer on the minimum Node
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: pnpm pack:check
      - name: Test native addon on the minimum Node
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: node --test ferrigura/test/*.test.mjs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        with:
          node-version: '26.13.1'
      - name: Test native addon on Node 26
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: node --test ferrigura/test/*.test.mjs
      - name: Exercise the musl addon in Alpine
        if: matrix.libc == 'musl'
        run: |
          docker run --rm -e CI=true -v "$PWD/..:/repo" -w /repo/node node:24-alpine sh -ec '
            npm install --global pnpm@11.28.8
            pnpm install --frozen-lockfile --ignore-scripts
            pnpm test
            pnpm pack:check
            mkdir -p replay
            node scripts/render-replay.mjs A > replay/${{ matrix.id }}.json
          '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-replay-${{ matrix.id }}
          path: node/replay/${{ matrix.id }}.json
          if-no-files-found: error

  native-replay-report:
    needs: [native-matrix, native-npm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: tools/port/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: tools/port/.node-version
      - run: pnpm -C tools/port install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: native-replay-*
          path: replay-artifacts
          merge-multiple: true
      - name: Compare captured SVGs
        env:
          REPLAY_MATRIX: ${{ needs.native-matrix.outputs.matrix }}
        run: |
          node tools/port/compare-native-replays.mjs replay-artifacts replay-report.md
          cat replay-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-comparison-report
          path: replay-report.md
          if-no-files-found: error
