name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          cache: pnpm
          node-version-file: '.node-version'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - name: Verify config types are in sync with the JSON schema
        run: pnpm run --filter mermaid types:verify-config
      - name: Verify no circular dependencies
        run: pnpm run --filter mermaid checkCircle

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          cache: pnpm
          node-version-file: '.node-version'
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run
      - name: Run ganttDb tests in a non-UTC timezone
        env:
          TZ: America/Los_Angeles
        run: pnpm exec vitest run ./packages/mermaid/src/diagrams/gantt/ganttDb.spec.ts
      - name: Verify out-of-tree build with TypeScript
        run: pnpm test:check:tsc

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # The toolchain comes from rust-toolchain.toml; the runner's rustup installs it on first use.
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --workspace
      - run: cargo test --workspace --no-fail-fast
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: '.node-version'
      - name: Node addon
        run: node --test crates/ferrigura-node/test/render.test.mjs

  port-diff:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        diagram:
          [
            pie,
            info,
            flowchart,
            sequence,
            class,
            state,
            er,
            gantt,
            timeline,
            gitgraph,
            journey,
            mindmap,
            block,
            packet,
            xychart,
            sankey,
            quadrantChart,
            requirement,
            c4,
            kanban,
            architecture,
            treemap,
            ishikawa,
            eventmodeling,
            agentflow,
            cynefin,
            radar,
            railroad,
            treeView,
            usecase,
            venn,
            wardley,
            flowchart-data,
            class-data,
            state-data,
            er-data,
            requirement-data,
            kanban-data,
            config,
            yaml,
            theme,
          ]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          cache: pnpm
          node-version-file: '.node-version'
      - run: pnpm install --frozen-lockfile
      - name: Differential parse against the TypeScript reference
        run: pnpm port:diff ${{ matrix.diagram }}
      - name: Pie header rules against the reference DB setters
        if: matrix.diagram == 'pie'
        run: pnpm port:check-header

  port-geometry:
    # The comparison needs a browser whose text layout keeps fractional glyph advances, as the Rust
    # measurement does. Chromium on macOS does; on Linux the classic themes still differ by about
    # 0.7 px with hinting off (docs-port/STATUS.md, open items).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          cache: pnpm
          node-version-file: '.node-version'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - name: Pie geometry against the JS reference in Chromium
        run: pnpm port:geometry-pie
      - name: Scoped styles of several pies in one page
        run: pnpm port:scope-pie
      - name: Flowchart geometry against the JS reference in Chromium
        run: pnpm port:geometry-flowchart
      - name: Venn layout exactly against its Chromium captures (arm64, as they were taken)
        # The Linux job compares the captures within a tolerance: without fused multiply-adds, atan2
        # rounds as V8 does on x86-64 (crates/ferrigura-venn/tests/corpus.rs).
        run: cargo test --release -p ferrigura-venn --test corpus
      - name: Geometry of the M6, P2 and P3 diagram types against the JS reference in Chromium
        # Every type runs, so one failing type does not hide the others.
        run: |
          status=0
          for type in sequence class state er gantt timeline gitgraph journey info requirement xychart kanban c4 block quadrantChart packet ishikawa sankey treemap eventmodeling mindmap architecture agentflow cynefin radar railroad treeView usecase venn wardley; do
            pnpm port:geometry "$type" || status=1
          done
          exit $status
