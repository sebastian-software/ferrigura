name: CI

# A pull request runs once, for its merge commit; a push to its branch does not run again. A push to
# main runs every job, and the release reads that run (docs/decisions/0005-quality-gates.md).
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: tools/port/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: pnpm
          cache-dependency-path: tools/port/pnpm-lock.yaml
          node-version-file: tools/port/.node-version
      - run: pnpm -C tools/port install --frozen-lockfile
      - run: pnpm -C tools/port run lint

  # README.md against what mdtheme generates from README.md.src and the pinned theme.
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.2
          install_args: --locked
      - run: mise run readme:check

  # The tests of the harness (tools/port), with node --test.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: tools/port/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: pnpm
          cache-dependency-path: tools/port/pnpm-lock.yaml
          node-version-file: tools/port/.node-version
      - run: pnpm -C tools/port install --frozen-lockfile
      - run: pnpm -C tools/port test

  rust:
    runs-on: ubuntu-latest
    env:
      # Integration-test binaries must fit on hosted runners; keep file/line backtraces.
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The toolchain comes from rust-toolchain.toml; the runner's rustup installs it on first use.
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --workspace
      - run: cargo test --workspace --no-fail-fast
      # The addon crate with one diagram type: its features stay compiling (decision 0020).
      - run: cargo test -p ferrigura-node --no-default-features --features sequence
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: tools/port/.node-version
      - name: Node addon
        run: node --test crates/ferrigura-node/test/render.test.mjs

  snapshots:
    # ferrigura's own output against crates/ferrigura/tests/snapshots/svg.tsv. The manifest holds the
    # aarch64 renders (ferrigura_jsmath rounds with fused multiply-adds there), so this runs on an arm64
    # runner: Linux, since the macOS runners queue for an hour and the hashes depend on the architecture
    # alone.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The arm64 image has no rustup; the toolchain itself comes from rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
      - run: cargo test --release --test snapshots
      - name: Venn layout exactly against its Chromium captures (arm64, as they were taken)
        # The x86-64 test job compares the captures within a tolerance: without fused multiply-adds,
        # atan2 rounds as V8 does on x86-64 (crates/ferrigura-venn/tests/corpus.rs).
        run: cargo test --release -p ferrigura-venn --test corpus

  # port-diff and port-geometry check ferrigura against upstream Mermaid at the pin of
  # tools/reference, with its patches (docs/decisions/0014-upstream-reference-at-a-pin.md), built once per pin and cached.
  port-diff:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        diagram:
          [
            pie,
            info,
            flowchart,
            sequence,
            class,
            state,
            er,
            gantt,
            timeline,
            gitgraph,
            journey,
            mindmap,
            block,
            packet,
            xychart,
            sankey,
            quadrantChart,
            requirement,
            c4,
            kanban,
            architecture,
            treemap,
            ishikawa,
            eventmodeling,
            agentflow,
            cynefin,
            radar,
            railroad,
            treeView,
            usecase,
            venn,
            wardley,
            swimlanes,
            flowchart-data,
            class-data,
            state-data,
            er-data,
            requirement-data,
            kanban-data,
            config,
            yaml,
            theme,
            markdown,
          ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: tools/port/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: pnpm
          cache-dependency-path: tools/port/pnpm-lock.yaml
          node-version-file: tools/port/.node-version
      - run: pnpm -C tools/port install --frozen-lockfile
      - name: Restore the reference build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/reference
          key: reference-${{ runner.os }}-${{ hashFiles('tools/reference/**') }}
      - name: Build the reference (upstream Mermaid at the pin, with its patches)
        run: echo "REFERENCE_ROOT=$(tools/reference/setup.sh)" >> "$GITHUB_ENV"
      - name: Differential parse against the reference
        run: pnpm -C tools/port port:diff ${{ matrix.diagram }}
      - name: Pie header rules against the reference DB setters
        if: matrix.diagram == 'pie'
        run: pnpm -C tools/port port:check-header

  port-geometry:
    # The comparison needs a browser whose text layout keeps fractional glyph advances, as the Rust
    # measurement does. Chromium on macOS does; on Linux the classic themes still differ by about
    # 0.7 px with hinting off (docs/LEARNINGS.md, open questions). The macOS runners queue for an hour,
    # so this runs for every push to main and for a pull request with the label ci:macos.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:macos')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: tools/port/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: pnpm
          cache-dependency-path: tools/port/pnpm-lock.yaml
          node-version-file: tools/port/.node-version
      - run: pnpm -C tools/port install --frozen-lockfile
      - name: Restore the reference build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/reference
          key: reference-${{ runner.os }}-${{ hashFiles('tools/reference/**') }}
      - name: Build the reference (upstream Mermaid at the pin, with its patches)
        run: echo "REFERENCE_ROOT=$(tools/reference/setup.sh)" >> "$GITHUB_ENV"
      - run: pnpm -C tools/port exec playwright install chromium
      - name: Pie geometry against the reference in Chromium
        run: pnpm -C tools/port port:geometry-pie
      - name: Scoped styles of several pies in one page
        run: pnpm -C tools/port port:scope-pie
      - name: Flowchart geometry against the reference in Chromium
        run: pnpm -C tools/port port:geometry-flowchart
      - name: Adaptive flowchart geometry against the reference with centered ports
        run: pnpm -C tools/port port:geometry-flowchart --routing adaptive
      - name: Geometry of the other diagram types against the reference in Chromium
        # Every type runs, so one failing type does not hide the others.
        run: |
          status=0
          for type in sequence class state er gantt timeline gitgraph journey info requirement xychart kanban c4 block quadrantChart packet ishikawa sankey treemap eventmodeling mindmap architecture agentflow cynefin radar railroad treeView usecase venn wardley swimlanes; do
            pnpm -C tools/port port:geometry "$type" || status=1
          done
          exit $status

  native-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          package_json_file: node/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
      - run: pnpm -C node install --frozen-lockfile --ignore-scripts
      - id: matrix
        working-directory: node
        # The macOS addon build needs a macOS runner, which queues for an hour: a pull request leaves it
        # out unless it carries the label ci:macos; the push to main builds every platform.
        run: echo "matrix=$(node scripts/native-matrix.mjs ${{ (github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ci:macos')) && '--without-macos' || '' }})" >> "$GITHUB_OUTPUT"

  native-npm:
    needs: native-matrix
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.native-matrix.outputs.matrix) }}
    defaults:
      run:
        shell: bash
        working-directory: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          package_json_file: node/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm native:check
      - name: Build native addon
        uses: ./node/node_modules/ferramenta-native/actions/build-native
        with:
          target: ${{ matrix.target }}
          libc: ${{ matrix.libc }}
          command: pnpm build
        env:
          FERRIGURA_RUST_TARGET: ${{ matrix.target }}
      - run: pnpm test && pnpm typecheck && pnpm lint && pnpm format:check && pnpm pack:check
        if: matrix.native
      - name: Exercise the musl addon in Alpine
        if: matrix.libc == 'musl'
        run: |
          docker run --rm -e CI=true -v "$PWD/..:/repo" -w /repo/node node:24-alpine sh -ec '
            npm install --global pnpm@11.28.8
            pnpm install --frozen-lockfile --ignore-scripts
            pnpm test
            pnpm pack:check
          '
