[package]
name = "text-measure-spike"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"
description = "Spike: measure label text without a browser (harfrust, skera, unicode-segmentation)"

# Standalone: not a member of the future ferrigura workspace.
[workspace]

[dependencies]
base64 = "0.23.1"
harfrust = "0.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
skera = "0.8.0"
unicode-linebreak = "0.1.5"
unicode-segmentation = "1.13.3"
write-fonts = { version = "0.54.1", default-features = false, features = ["read"] }
