<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SVG kerning lab</title>
    <!--
      Which switches make a browser kern and ligate SVG text?

      Every variant draws the test lines as SVG <text> and compares getComputedTextLength with
      four HTML references measured in the same browser: kerned with ligatures ("full"), kerning
      off, ligatures off, and both off ("plain"). The verdict names the reference that matches
      within 0.02 px. Results are shown in the page and posted to /result.
    -->
    <style>
      @font-face {
        font-family: 'lab';
        src: url('/fonts/LexicaUltralegible-Regular.ttf');
      }
      body {
        font:
          13px/1.4 system-ui,
          sans-serif;
        margin: 16px;
        background: #fff;
        color: #111;
      }
      table {
        border-collapse: collapse;
      }
      td,
      th {
        border: 1px solid #ccc;
        padding: 2px 6px;
        text-align: left;
      }
      .ref {
        font-family: 'lab';
        white-space: pre;
        position: absolute;
        left: -10000px;
      }
      #stage {
        position: absolute;
        left: -10000px;
      }
    </style>
  </head>
  <body>
    <h1>SVG kerning lab</h1>
    <p id="ua"></p>
    <div id="out">running…</div>
    <svg id="stage" xmlns="http://www.w3.org/2000/svg" width="2000" height="200"></svg>
    <script>
      const LINES = {
        kern: 'AVATAR Type WAVE Yo Te LT',
        liga: 'office fluffy fjord affinity',
        label: 'Update the order status',
      };
      const SIZES = [12, 16, 24, 48];
      const SVG = 'http://www.w3.org/2000/svg';

      // Each variant: CSS on the <text> element, attributes, and an optional structure.
      const VARIANTS = [
        { name: 'baseline' },
        { name: 'white-space: pre', css: 'white-space: pre' },
        { name: 'font-kerning: normal', css: 'font-kerning: normal' },
        {
          name: 'font-kerning: normal + liga',
          css: 'font-kerning: normal; font-variant-ligatures: common-ligatures',
        },
        { name: 'text-rendering: optimizeLegibility', css: 'text-rendering: optimizeLegibility' },
        { name: 'text-rendering: geometricPrecision', css: 'text-rendering: geometricPrecision' },
        { name: 'text-rendering: optimizeSpeed', css: 'text-rendering: optimizeSpeed' },
        {
          name: 'font-feature-settings kern liga',
          css: 'font-feature-settings: "kern" 1, "liga" 1',
        },
        { name: 'attribute text-rendering', attrs: { 'text-rendering': 'optimizeLegibility' } },
        { name: 'text-anchor: middle', attrs: { 'text-anchor': 'middle', x: '1000' } },
        { name: 'one tspan', tspan: true },
        { name: 'letter-spacing: 0', css: 'letter-spacing: 0px' },
        { name: 'word-spacing: 0', css: 'word-spacing: 0px' },
        { name: 'textLength (reference)', textLength: true },
      ];

      const refSpan = (css) => {
        const span = document.createElement('span');
        span.className = 'ref';
        span.style.cssText += css;
        document.body.append(span);
        return span;
      };
      const refs = {
        full: refSpan('font-kerning: normal; font-variant-ligatures: normal'),
        nokern: refSpan('font-kerning: none; font-variant-ligatures: normal'),
        noliga: refSpan('font-kerning: normal; font-variant-ligatures: none'),
        plain: refSpan('font-kerning: none; font-variant-ligatures: none'),
      };
      const refWidths = (text, size) =>
        Object.fromEntries(
          Object.entries(refs).map(([key, span]) => {
            span.style.fontSize = `${size}px`;
            span.textContent = text;
            return [key, span.getBoundingClientRect().width];
          })
        );

      const stage = document.getElementById('stage');
      const svgWidth = (variant, text, size) => {
        const el = document.createElementNS(SVG, 'text');
        el.setAttribute('x', '10');
        el.setAttribute('y', '100');
        el.setAttribute('font-family', 'lab');
        el.setAttribute('font-size', String(size));
        for (const [key, value] of Object.entries(variant.attrs ?? {})) {
          el.setAttribute(key, value);
        }
        if (variant.css) {
          el.setAttribute('style', variant.css);
        }
        if (variant.tspan) {
          const tspan = document.createElementNS(SVG, 'tspan');
          tspan.textContent = text;
          el.append(tspan);
        } else {
          el.textContent = text;
        }
        if (variant.textLength) {
          el.setAttribute('textLength', String(refWidths(text, size).full));
          el.setAttribute('lengthAdjust', 'spacing');
        }
        stage.append(el);
        const n = el.getNumberOfChars();
        // The drawn extent: start of the first character to the end of the last one.
        const extent = el.getEndPositionOfChar(n - 1).x - el.getStartPositionOfChar(0).x;
        const length = el.getComputedTextLength();
        el.remove();
        return { length, extent };
      };

      const verdict = (width, ref) => {
        const hits = Object.entries(ref)
          .filter(([, w]) => Math.abs(width - w) < 0.02)
          .map(([key]) => key);
        if (hits.length) return hits.join('/');
        const [key, w] = Object.entries(ref).sort(
          (a, b) => Math.abs(width - a[1]) - Math.abs(width - b[1])
        )[0];
        return `none (nearest ${key} ${(width - w).toFixed(2)})`;
      };

      async function run() {
        await document.fonts.load('16px lab');
        await document.fonts.ready;
        const rows = [];
        for (const variant of VARIANTS) {
          for (const [lineKey, text] of Object.entries(LINES)) {
            for (const size of SIZES) {
              const ref = refWidths(text, size);
              const { length, extent } = svgWidth(variant, text, size);
              rows.push({
                variant: variant.name,
                line: lineKey,
                size,
                length,
                extent,
                ref,
                lengthVerdict: verdict(length, ref),
                extentVerdict: verdict(extent, ref),
              });
            }
          }
        }
        const sameRefs = rows
          .filter((r) => r.line === 'kern')
          .every((r) => Math.abs(r.ref.full - r.ref.nokern) > 0.5);
        document.getElementById('ua').textContent = navigator.userAgent;
        const table = document.createElement('table');
        table.innerHTML =
          '<tr><th>variant</th><th>line</th><th>size</th><th>drawn extent matches</th><th>getComputedTextLength matches</th></tr>' +
          rows
            .map(
              (r) =>
                `<tr><td>${r.variant}</td><td>${r.line}</td><td>${r.size}</td><td>${r.extentVerdict}</td><td>${r.lengthVerdict}</td></tr>`
            )
            .join('');
        const out = document.getElementById('out');
        out.textContent = sameRefs
          ? ''
          : 'Warning: the HTML references do not differ, so kerning is not measurable here.';
        out.append(table);
        const result = { userAgent: navigator.userAgent, rows };
        window.labResult = result;
        await fetch(`/result${location.search}`, {
          method: 'POST',
          body: JSON.stringify(result),
        }).catch(() => undefined);
        document.title = 'SVG kerning lab: done';
      }
      run();
    </script>
  </body>
</html>
