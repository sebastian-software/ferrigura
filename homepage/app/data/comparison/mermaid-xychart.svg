<svg id="mermaid-xychart" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 700px;" viewBox="0 0 700 500" role="graphics-document document" aria-roledescription="xychart"><style>#mermaid-xychart{font-family:"Lexica Ultralegible";font-size:14px;fill:#28253D;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mermaid-xychart .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mermaid-xychart .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mermaid-xychart .error-icon{fill:#ffffff;}#mermaid-xychart .error-text{fill:#000000;stroke:#000000;}#mermaid-xychart .edge-thickness-normal{stroke-width:2px;}#mermaid-xychart .edge-thickness-thick{stroke-width:3.5px;}#mermaid-xychart .edge-pattern-solid{stroke-dasharray:0;}#mermaid-xychart .edge-thickness-invisible{stroke-width:0;fill:none;}#mermaid-xychart .edge-pattern-dashed{stroke-dasharray:3;}#mermaid-xychart .edge-pattern-dotted{stroke-dasharray:2;}#mermaid-xychart .marker{fill:#000000;stroke:#000000;}#mermaid-xychart .marker.cross{stroke:#000000;}#mermaid-xychart svg{font-family:"Lexica Ultralegible";font-size:14px;}#mermaid-xychart p{margin:0;}#mermaid-xychart .node .neo-node{stroke:#28253D;}#mermaid-xychart [data-look="neo"].node rect,#mermaid-xychart [data-look="neo"].cluster rect,#mermaid-xychart [data-look="neo"].node polygon{stroke:#28253D;filter:url(#mermaid-xychart-drop-shadow);}#mermaid-xychart [data-look="neo"].swimlane.cluster rect{filter:none;}#mermaid-xychart [data-look="neo"].node path{stroke:#28253D;stroke-width:2px;}#mermaid-xychart [data-look="neo"].node .outer-path{filter:url(#mermaid-xychart-drop-shadow);}#mermaid-xychart [data-look="neo"].node .neo-line path{stroke:#28253D;filter:none;}#mermaid-xychart [data-look="neo"].node circle{stroke:#28253D;filter:url(#mermaid-xychart-drop-shadow);}#mermaid-xychart [data-look="neo"].node circle .state-start{fill:#000000;}#mermaid-xychart [data-look="neo"].icon-shape .icon{fill:#28253D;filter:url(#mermaid-xychart-drop-shadow);}#mermaid-xychart [data-look="neo"].icon-shape .icon-neo path{stroke:#28253D;filter:url(#mermaid-xychart-drop-shadow);}#mermaid-xychart :root{--mermaid-font-family:"Lexica Ultralegible";}</style><g></g><g class="main"><rect width="700" height="500" class="background" fill="#ffffff"></rect><g class="chart-title"><text x="0" y="0" fill="#28253D" font-size="20" dominant-baseline="middle" text-anchor="middle" transform="translate(382.3359384536743, 22.5) rotate(0)">Monthly downloads</text></g><g class="plot"><g class="bar-plot-0"><rect x="66.42187690734863" y="360.53999999999996" width="66.5" height="105.46000000000004" fill="#FFF4DD" stroke="#FFF4DD" stroke-width="0"></rect><rect x="179.4875015258789" y="320.14" width="66.5" height="145.86" fill="#FFF4DD" stroke="#FFF4DD" stroke-width="0"></rect><rect x="292.5531261444092" y="287.82000000000005" width="66.5" height="178.17999999999995" fill="#FFF4DD" stroke="#FFF4DD" stroke-width="0"></rect><rect x="405.6187507629395" y="215.1" width="66.5" height="250.9" fill="#FFF4DD" stroke="#FFF4DD" stroke-width="0"></rect><rect x="518.6843753814697" y="182.77999999999997" width="66.5" height="283.22" fill="#FFF4DD" stroke="#FFF4DD" stroke-width="0"></rect><rect x="631.75" y="93.89999999999999" width="66.5" height="372.1" fill="#FFF4DD" stroke="#FFF4DD" stroke-width="0"></rect></g><g class="line-plot-1"><path d="M99.672,376.7L212.738,336.3L325.803,295.9L438.869,255.5L551.934,215.1L665,174.7" fill="none" stroke="#FFD8B1" stroke-width="2"></path></g></g><g class="bottom-axis"><g class="axis-line"><path d="M 64.67187690734863,467 L 700,467" fill="none" stroke="#28253D" stroke-width="2"></path></g><g class="label"><text x="0" y="0" fill="#28253D" font-size="14" dominant-baseline="text-before-edge" text-anchor="middle" transform="translate(99.6718769073