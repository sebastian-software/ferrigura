<svg id="mermaid-pie" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650.265625 450" style="max-width: 650.265625px;" role="graphics-document document" aria-roledescription="pie"><style>#mermaid-pie{font-family:"Lexica Ultralegible";font-size:14px;fill:#28253D;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mermaid-pie .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mermaid-pie .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mermaid-pie .error-icon{fill:#ffffff;}#mermaid-pie .error-text{fill:#000000;stroke:#000000;}#mermaid-pie .edge-thickness-normal{stroke-width:2px;}#mermaid-pie .edge-thickness-thick{stroke-width:3.5px;}#mermaid-pie .edge-pattern-solid{stroke-dasharray:0;}#mermaid-pie .edge-thickness-invisible{stroke-width:0;fill:none;}#mermaid-pie .edge-pattern-dashed{stroke-dasharray:3;}#mermaid-pie .edge-pattern-dotted{stroke-dasharray:2;}#mermaid-pie .marker{fill:#000000;stroke:#000000;}#mermaid-pie .marker.cross{stroke:#000000;}#mermaid-pie svg{font-family:"Lexica Ultralegible";font-size:14px;}#mermaid-pie p{margin:0;}#mermaid-pie .pieCircle{stroke:black;stroke-width:2px;opacity:0.7;}#mermaid-pie .pieCircle.highlighted{scale:1.05;opacity:1;}#mermaid-pie .pieCircle.highlightedOnHover:hover{transition-duration:250ms;scale:1.05;opacity:1;}#mermaid-pie .pieOuterCircle{stroke:black;stroke-width:2px;fill:none;}#mermaid-pie .pieTitleText{text-anchor:middle;font-size:25px;fill:#28253D;font-family:"Lexica Ultralegible";}#mermaid-pie .slice{font-family:"Lexica Ultralegible";fill:#28253D;font-size:17px;}#mermaid-pie .legend text{fill:#28253D;font-family:"Lexica Ultralegible";font-size:17px;}#mermaid-pie .node .neo-node{stroke:#28253D;}#mermaid-pie [data-look="neo"].node rect,#mermaid-pie [data-look="neo"].cluster rect,#mermaid-pie [data-look="neo"].node polygon{stroke:#28253D;filter:url(#mermaid-pie-drop-shadow);}#mermaid-pie [data-look="neo"].swimlane.cluster rect{filter:none;}#mermaid-pie [data-look="neo"].node path{stroke:#28253D;stroke-width:2px;}#mermaid-pie [data-look="neo"].node .outer-path{filter:url(#mermaid-pie-drop-shadow);}#mermaid-pie [data-look="neo"].node .neo-line path{stroke:#28253D;filter:none;}#mermaid-pie [data-look="neo"].node circle{stroke:#28253D;filter:url(#mermaid-pie-drop-shadow);}#mermaid-pie [data-look="neo"].node circle .state-start{fill:#000000;}#mermaid-pie [data-look="neo"].icon-shape .icon{fill:#28253D;filter:url(#mermaid-pie-drop-shadow);}#mermaid-pie [data-look="neo"].icon-shape .icon-neo path{stroke:#28253D;filter:url(#mermaid-pie-drop-shadow);}#mermaid-pie :root{--mermaid-font-family:"Lexica Ultralegible";}</style><g></g><g transform="translate(225,225)"><g><circle cx="0" cy="0" r="186" class="pieOuterCircle"></circle><path d="M0,-185A185,185,0,0,1,49.912,178.14L0,0Z" fill="#f4a8ff" class="pieCircle"></path><path d="M49.912,178.14A185,185,0,0,1,-151.139,106.686L0,0Z" fill="#46ecd5" class="pieCircle"></path><path d="M-151.139,106.686A185,185,0,0,1,-174.318,-61.953L0,0Z" fill="#ffb86a" class="pieCircle"></path><path d="M-174.318,-61.953A185,185,0,0,1,-85.112,-164.259L0,0Z" fill="#dab2ff" class="pieCircle"></path><path d="M-85.112,-164.259A185,185,0,0,1,0,-185L0,0Z" fill="#7bf1a8" class="pieCircle"></path><text transform="translate(137.4576750125409,-18.893122562104207)" class="slice" style="text-anchor: middle;">46%</text><text transform="translate(-46.46454618872433,130.73870294398634)" class="slice" style="text-anchor: middle;">20%</text><text transform="translate(-137.45767501254088,18.893122562104285)" class="slice" style="text-anchor: middle;">15%</text><text transform="translate(-104.57768226417137,-91.18701043599364)" class="slice" style="text-anchor: middle;">12%</text><text transform="translate(-32.85106333971942,-134.80493365396438)" class="slice" style="