<svg id="homepage-quadrant" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 500px;" viewBox="0 0 500 500" role="graphics-document document" aria-roledescription="quadrantChart"><style>@font-face{font-family:"fg-bd445392c1785aa4-sans";font-weight:400;font-style:normal;src:url(data:font/ttf;base64,)}#homepage-quadrant{--textColor:#1A1F2B;--lineColor:#5B6577;--nodeBorder:#7C8698;--errorBkgColor:#ffffff;--errorTextColor:#000000;}#homepage-quadrant{font-family:"fg-bd445392c1785aa4-sans";font-size:14px;fill:var(--textColor);}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#homepage-quadrant .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#homepage-quadrant .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#homepage-quadrant .error-icon{fill:var(--errorBkgColor);}#homepage-quadrant .error-text{fill:var(--errorTextColor);stroke:var(--errorTextColor);}#homepage-quadrant .edge-thickness-normal{stroke-width:2px;}#homepage-quadrant .edge-thickness-thick{stroke-width:3.5px;}#homepage-quadrant .edge-pattern-solid{stroke-dasharray:0;}#homepage-quadrant .edge-thickness-invisible{stroke-width:0;fill:none;}#homepage-quadrant .edge-pattern-dashed{stroke-dasharray:3;}#homepage-quadrant .edge-pattern-dotted{stroke-dasharray:2;}#homepage-quadrant .marker{fill:var(--lineColor);stroke:var(--lineColor);}#homepage-quadrant .marker.cross{stroke:var(--lineColor);}#homepage-quadrant svg{font-family:"fg-bd445392c1785aa4-sans";font-size:14px;}#homepage-quadrant p{margin:0;}#homepage-quadrant .node .neo-node{stroke:var(--nodeBorder);}#homepage-quadrant [data-look="neo"].node rect,#homepage-quadrant [data-look="neo"].cluster rect,#homepage-quadrant [data-look="neo"].node polygon{stroke:var(--nodeBorder);filter:url(#homepage-quadrant-drop-shadow);}#homepage-quadrant [da