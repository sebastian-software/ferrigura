<svg id="homepage-xychart" xmlns="http://www.w3.org/2000/svg" width="100%" style="max-width: 700px;" viewBox="0 0 700 500" role="graphics-document document" aria-roledescription="xychart"><style>@font-face{font-family:"fg-d5e8e121834619bd-sans";font-weight:400;font-style:normal;src:url(data:font/ttf;base64,)}#homepage-xychart{--textColor:#1A1F2B;--lineColor:#5B6577;--nodeBorder:#7C8698;--errorBkgColor:#ffffff;--errorTextColor:#000000;}#homepage-xychart{font-family:"fg-d5e8e121834619bd-sans";font-size:14px;fill:var(--textColor);}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#homepage-xychart .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#homepage-xychart .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#homepage-xychart .error-icon{fill:var(--errorBkgColor);}#homepage-xychart .error-text{fill:var(--errorTextColor);stroke:var(--errorTextColor);}#homepage-xychart .edge-thickness-normal{stroke-width:2px;}#homepage-xychart .edge-thickness-thick{stroke-width:3.5px;}#homepage-xychart .edge-pattern-solid{stroke-dasharray:0;}#homepage-xychart .edge-thickness-invisible{stroke-width:0;fill:none;}#homepage-xychart .edge-pattern-dashed{stroke-dasharray:3;}#homepage-xychart .edge-pattern-dotted{stroke-dasharray:2;}#homepage-xychart .marker{fill:var(--lineColor);stroke:var(--lineColor);}#homepage-xychart .marker.cross{stroke:var(--lineColor);}#homepage-xychart svg{font-family:"fg-d5e8e121834619bd-sans";font-size:14px;}#homepage-xychart p{margin:0;}#homepage-xychart .node .neo-node{stroke:var(--nodeBorder);}#homepage-xychart [data-look="neo"].node rect,#homepage-xychart [data-look="neo"].cluster rect,#homepage-xychart [data-look="neo"].node polygon{stroke:var(--nodeBorder);filter:url(#homepage-xychart-drop-shadow);}#homepage-xychart [data-look="neo"].swimlane.clust