[package]
name = "ferrigura"
description = "Render Mermaid diagram text to SVG, without a browser"
readme = "README.md"
include = ["src/**", "Cargo.toml", "README.md", "LICENSE*"]
keywords = ["mermaid", "diagram", "svg", "rendering", "flowchart"]
categories = ["visualization", "rendering"]
documentation = "https://docs.rs/ferrigura"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ferrigura-model.workspace = true
ferrigura-render = { path = "../ferrigura-render", version = "0.0.0" }
ferrigura-syntax = { path = "../ferrigura-syntax", version = "0.0.0" }
serde_json.workspace = true

[dev-dependencies]
roxmltree = "0.21"
