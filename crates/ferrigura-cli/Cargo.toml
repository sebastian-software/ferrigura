[package]
name = "ferrigura-cli"
description = "Render a Mermaid diagram file to SVG from the command line"
readme = "README.md"
include = ["/src/**", "/Cargo.toml", "/README.md", "/LICENSE*"]
keywords = ["ferrigura", "mermaid", "diagram", "svg", "cli"]
categories = ["command-line-utilities", "visualization"]
documentation = "https://docs.rs/ferrigura-cli"
version = "0.10.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "ferrigura"
path = "src/main.rs"
# The library `ferrigura` has the same name and its documentation is the one that matters.
doc = false

[features]
experimental-tala = ["ferrigura/experimental-tala"]

[dependencies]
ferrigura = { path = "../..", version = "0.10.0" }
ferrigura-model = { path = "../ferrigura-model", version = "0.10.0" }
serde_json.workspace = true
sha2 = "0.11.1"
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }
url = "2.5.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# mimalloc is the global allocator only where its C source builds with the target's own C compiler.
# musl keeps the system allocator: the addon's musl build is cross-compiled with Zig, which is not
# verified for it. The same list gates the allocator in src/main.rs.
[target.'cfg(any(target_os = "macos", all(target_os = "linux", target_env = "gnu"), all(target_os = "windows", target_env = "msvc")))'.dependencies]
mimalloc = { version = "0.1.52", default-features = false }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
