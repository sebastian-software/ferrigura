[package]
name = "ferrigura-cli"
description = "Render a Mermaid diagram file to SVG from the command line"
readme = "README.md"
include = ["/src/**", "/Cargo.toml", "/README.md", "/LICENSE*"]
keywords = ["ferrigura", "mermaid", "diagram", "svg", "cli"]
categories = ["command-line-utilities", "visualization"]
documentation = "https://docs.rs/ferrigura-cli"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "ferrigura"
path = "src/main.rs"
# The library `ferrigura` has the same name and its documentation is the one that matters.
doc = false

[dependencies]
ferrigura = { path = "../..", version = "0.0.0" }
ferrigura-model = { path = "../ferrigura-model", version = "0.0.0" }
serde_json.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
