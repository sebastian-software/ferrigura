[package]
name = "ferrigura-text"
description = "Text measurement, Mermaid line wrapping and font embedding for ferrigura labels"
readme = "README.md"
include = ["/src/**", "/Cargo.toml", "/README.md", "/LICENSE*", "/NOTICE.md", "/fonts/**"]
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT AND OFL-1.1 AND CC-BY-4.0"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/ferrigura-text"
keywords = ["ferrigura", "text", "font", "measurement", "svg"]
publish.workspace = true

[dependencies]
base64 = "0.23.1"
harfrust = "0.14.0"
read-fonts = "0.45.1"
skera = "0.8.0"
unicode-segmentation = "1.13.3"

[dev-dependencies]
serde_json = "1.0.154"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
