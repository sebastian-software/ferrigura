[package]
name = "ferrigura-model"
description = "Diagram models, configuration and their canonical JSON form for ferrigura"
readme = "README.md"
include = ["/src/**", "/Cargo.toml", "/README.md", "/LICENSE*", "/build.rs", "/schema/**"]
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/ferrigura-model"
keywords = ["ferrigura", "mermaid", "diagram", "config"]

[dependencies]
regex = "1"
serde.workspace = true
serde_json.workspace = true

[build-dependencies]
serde_json.workspace = true
serde_yaml_ng = "0.10"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
