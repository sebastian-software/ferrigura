[package]
name = "ferrigura-cose"
version = "0.11.0"
description = "The force-directed layout of Mermaid's mindmaps, ported from the JavaScript sources: the tree path of cytoscape-cose-bilkent 4.1.0"
readme = "README.md"
include = ["/src/**", "/Cargo.toml", "/README.md", "/LICENSE*", "/NOTICE.md"]
edition.workspace = true
rust-version.workspace = true
license = "MIT"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/ferrigura-cose"
keywords = ["ferrigura", "graph", "layout", "force-directed", "cose"]

[dependencies]
ferrigura-jsmath = { path = "../ferrigura-jsmath", version = "0.11.0" }

[dev-dependencies]
serde_json.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
