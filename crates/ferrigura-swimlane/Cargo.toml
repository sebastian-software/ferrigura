[package]
name = "ferrigura-swimlane"
description = "The swimlane layout ported from Mermaid 12.2.0's swimlanes layout engine: the Sugiyama phases, the orthogonal router and the geometry passes (MIT)"
readme = "README.md"
include = ["/src/**", "/Cargo.toml", "/README.md", "/LICENSE*", "/NOTICE.md"]
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/ferrigura-swimlane"
keywords = ["ferrigura", "swimlane", "layout", "diagram", "sugiyama"]

[dependencies]
ferrigura-jsmath = { path = "../ferrigura-jsmath", version = "0.2.0" }
indexmap.workspace = true
serde_json.workspace = true

[dev-dependencies]
serde.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
