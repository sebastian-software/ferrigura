[package]
name = "ferrigura-node"
description = "The ferrigura Node addon: renders Mermaid diagram text to SVG in Node.js"
readme = "README.md"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# A Node addon (a cdylib): it goes to npm with its prebuilt binaries, not to crates.io.
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
ferrigura = { path = "../..", version = "0.3.0" }
ferrigura-model = { path = "../ferrigura-model", version = "0.3.0" }
napi = { version = "3", default-features = false, features = ["dyn-symbols", "napi8", "serde-json"] }
napi-derive = "3"
serde_json.workspace = true

[build-dependencies]
napi-build = "2"
