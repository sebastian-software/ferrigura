[package]
name = "ferrigura-node"
description = "The ferrigura Node addon: renders Mermaid diagram text to SVG in Node.js"
readme = "README.md"
version = "0.10.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# A Node addon (a cdylib): it goes to npm with its prebuilt binaries, not to crates.io.
publish = false

[lib]
crate-type = ["cdylib"]

# One feature per diagram type, named as its constructor in `ferrigura::diagrams`. The published
# addon is built with `all`; a program that builds its own addon enables the types it draws, and the
# linker leaves out the rest (docs/decisions/0020-diagram-types-as-plugins.md).
[features]
default = ["all"]
all = [
    "pie",
    "flowchart",
    "er",
    "class",
    "sequence",
    "state",
    "gantt",
    "mindmap",
    "xy_chart",
    "quadrant_chart",
]
pie = []
flowchart = []
er = []
class = []
sequence = []
state = []
gantt = []
mindmap = []
xy_chart = []
quadrant_chart = []


[dependencies]
ferrigura = { path = "../..", version = "0.10.0" }
ferrigura-model = { path = "../ferrigura-model", version = "0.10.0" }
napi = { version = "3", default-features = false, features = ["dyn-symbols", "napi8", "serde-json"] }
napi-derive = "3"
serde_json.workspace = true

[build-dependencies]
napi-build = "2"

# mimalloc is the global allocator only where its C source builds with the target's own C compiler.
# musl keeps the system allocator: the addon's musl build is cross-compiled with Zig, which is not
# verified for it. The same list gates the allocator in src/lib.rs.
[target.'cfg(any(target_os = "macos", all(target_os = "windows", target_env = "msvc")))'.dependencies]
mimalloc = { version = "0.1.52", default-features = false }

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
# The addon is dlopen'd: initial-exec TLS can exhaust the static TLS block, so use local-dynamic.
mimalloc = { version = "0.1.52", default-features = false, features = ["local_dynamic_tls"] }
