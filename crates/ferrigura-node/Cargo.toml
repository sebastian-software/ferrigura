[package]
name = "ferrigura-node"
description = "The ferrigura Node addon: renders Mermaid diagram text to SVG in Node.js"
readme = "README.md"
version = "0.7.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# A Node addon (a cdylib): it goes to npm with its prebuilt binaries, not to crates.io.
publish = false

[lib]
crate-type = ["cdylib"]

# One feature per diagram type, named as its constructor in `ferrigura::diagrams`. The published
# addon is built with `all`; a program that builds its own addon enables the types it draws, and the
# linker leaves out the rest (docs/decisions/0020-diagram-types-as-plugins.md).
[features]
default = ["all"]
all = [
    "pie",
    "info",
    "flowchart",
    "timeline",
    "journey",
    "git_graph",
    "er",
    "class",
    "sequence",
    "state",
    "gantt",
    "mindmap",
    "block",
    "packet",
    "xy_chart",
    "sankey",
    "quadrant_chart",
    "requirement",
    "c4",
    "kanban",
    "architecture",
    "treemap",
    "ishikawa",
    "event_modeling",
    "agentflow",
    "cynefin",
    "radar",
    "railroad",
    "swimlanes",
    "tree_view",
    "use_case",
    "venn",
    "wardley",
]
pie = []
info = []
flowchart = []
timeline = []
journey = []
git_graph = []
er = []
class = []
sequence = []
state = []
gantt = []
mindmap = []
block = []
packet = []
xy_chart = []
sankey = []
quadrant_chart = []
requirement = []
c4 = []
kanban = []
architecture = []
treemap = []
ishikawa = []
event_modeling = []
agentflow = []
cynefin = []
radar = []
railroad = []
swimlanes = []
tree_view = []
use_case = []
venn = []
wardley = []


[dependencies]
ferrigura = { path = "../..", version = "0.7.0" }
ferrigura-model = { path = "../ferrigura-model", version = "0.7.0" }
napi = { version = "3", default-features = false, features = ["dyn-symbols", "napi8", "serde-json"] }
napi-derive = "3"
serde_json.workspace = true

[build-dependencies]
napi-build = "2"
