[package]
name = "ferrigura-elk"
version = "0.1.0"
description = "ELK Layered layout ported from the Eclipse Layout Kernel Java sources (EPL-2.0)"
readme = "README.md"
include = ["/src/**", "/Cargo.toml", "/README.md", "/LICENSE*", "/NOTICE.md"]
edition.workspace = true
rust-version.workspace = true
license = "EPL-2.0"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/ferrigura-elk"
keywords = ["ferrigura", "elk", "graph", "layout", "diagram"]

[dependencies]
indexmap.workspace = true
serde.workspace = true
serde_json.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
