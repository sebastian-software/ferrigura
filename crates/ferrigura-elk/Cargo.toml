[package]
name = "ferrigura-elk"
version = "0.0.0"
description = "ELK Layered layout ported from the Eclipse Layout Kernel Java sources (EPL-2.0)"
edition.workspace = true
rust-version.workspace = true
license = "EPL-2.0"
repository.workspace = true
publish.workspace = true

[dependencies]
indexmap.workspace = true
serde.workspace = true
# Exact parsing of JSON numbers, as JavaScript reads them; the default parser can be a few ulps off.
serde_json = { workspace = true, features = ["float_roundtrip"] }
